# Render Blueprint for Financial Document Scanner. Deploy via Render's
# "New +" -> "Blueprint"
# and point it at this repo. Verify these keys against Render's current
# Blueprint docs before relying on this. The schema has changed over time
# and this hasn't been run against a live Render account.
#
# You also need a Supabase project (see backend/supabase/schema.sql for the
# one-time table setup). Set SUPABASE_URL / SUPABASE_ANON_KEY below and
# VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY on the frontend to the same
# project's values (Supabase dashboard -> Settings -> API).
#
# After the first deploy, both services get an onrender.com URL. Set
# ALLOWED_ORIGINS (api service) and VITE_API_BASE_URL (frontend service) to
# each other's real URL, then redeploy. They're left unset here (sync: false)
# because neither URL is known until after the first deploy.
services:
  - type: web
    name: financial-document-scanner-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python -m app.ml.generate_dataset &&
      python -m app.ml.train_classifier
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_DEFAULT
        value: 60/minute
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "10485760"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: financial-document-scanner-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
